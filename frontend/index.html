<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#0d1c2e",
              "on-background": "#181c1e",
              "primary-fixed": "#d6e3ff",
              "inverse-on-surface": "#eef1f3",
              "on-primary": "#ffffff",
              "on-surface-variant": "#43474e",
              "inverse-surface": "#2d3133",
              "primary-fixed-dim": "#adc7f7",
              "surface-dim": "#d7dadc",
              "surface-bright": "#f7fafc",
              "on-primary-container": "#86a0cd",
              "surface-tint": "#455f88",
              "secondary-container": "#d1e1fa",
              "tertiary-fixed-dim": "#ebc071",
              "surface-container-low": "#f1f4f6",
              "secondary-fixed-dim": "#b8c8e0",
              "surface-container-lowest": "#ffffff",
              surface: "#f7fafc",
              primary: "#002045",
              "secondary-fixed": "#d4e4fc",
              "surface-variant": "#e0e3e5",
              "surface-container-high": "#e5e9eb",
              "surface-container": "#ebeef0",
              "on-secondary-fixed-variant": "#39485c",
              "surface-container-highest": "#e0e3e5",
              "on-tertiary": "#ffffff",
              "tertiary-fixed": "#ffdea5",
              "on-tertiary-fixed": "#271900",
              "on-error-container": "#93000a",
              "on-tertiary-fixed-variant": "#5d4200",
              "on-primary-fixed-variant": "#2d476f",
              background: "#f7fafc",
              error: "#ba1a1a",
              outline: "#74777f",
              "primary-container": "#1a365d",
              "on-secondary-container": "#556479",
              "on-error": "#ffffff",
              "tertiary-container": "#483200",
              secondary: "#515f74",
              "outline-variant": "#c4c6cf",
              "on-tertiary-container": "#c0994e",
              "error-container": "#ffdad6",
              "inverse-primary": "#adc7f7",
              "on-primary-fixed": "#001b3c",
              tertiary: "#2d1e00",
              "on-surface": "#181c1e",
              "on-secondary": "#ffffff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              base: "8px",
              "container-max": "1280px",
              "margin-mobile": "16px",
              "stack-lg": "24px",
              "margin-desktop": "32px",
              gutter: "24px",
              "stack-sm": "4px",
              "stack-md": "12px",
            },
            fontFamily: {
              "title-lg": ["Inter"],
              "headline-lg": ['"Source Serif 4"'],
              "body-lg": ["Inter"],
              "headline-lg-mobile": ['"Source Serif 4"'],
              "headline-md": ['"Source Serif 4"'],
              "body-md": ["Inter"],
              "label-md": ["Inter"],
              "display-lg": ['"Source Serif 4"'],
            },
            fontSize: {
              "title-lg": ["20px", { lineHeight: "28px", fontWeight: "600" }],
              "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
              "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
            },
          },
        },
      };
    </script>
    <style>
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: theme("colors.surface-container");
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: theme("colors.outline-variant");
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: theme("colors.outline");
      }
      .halo-focus:focus-within {
        box-shadow: 0 0 0 2px rgba(0, 32, 69, 0.2);
        border-color: theme("colors.primary");
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
